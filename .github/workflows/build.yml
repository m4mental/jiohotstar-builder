name: Build Patched JioHotstar APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct URL for JioHotstar (Drive, Catbox, APK, APKM, etc.)'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK (Java 21 Required)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Tools, Python Gdown & Android Build-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl wget unzip file aapt python3-pip
          pip install --break-system-packages gdown || pip install gdown
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          echo "Using Android Build-Tools from: $BUILD_TOOLS_DIR"
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

      - name: Download Morphe CLI
        run: |
          echo "Fetching latest Morphe Desktop / CLI..."
          CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)

          if [ -z "$CLI_URL" ] || [ "$CLI_URL" == "null" ]; then
            CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-cli/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)
          fi

          echo "Downloading Morphe CLI from: $CLI_URL"
          curl -L -o morphe-cli.jar "$CLI_URL"

      - name: Download APKEditor (For Merging Bundles)
        run: |
          echo "Fetching latest APKEditor..."
          APKEDITOR_URL=$(curl -s https://api.github.com/repos/REAndroid/APKEditor/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url')
          curl -L -o APKEditor.jar "$APKEDITOR_URL"

      - name: Download Paresh Patches from GitLab
        run: |
          echo "Fetching latest paresh-patches release from GitLab..."
          RELEASE_INFO=$(curl -s "https://gitlab.com/api/v4/projects/Paresh-Maheshwari%2Fparesh-patches/releases")
          
          PATCH_URL=$(echo "$RELEASE_INFO" | jq -r '.[0].assets.links[]? | select(.name | test("\\.(mpp|rvp|jar)$")) | .url' | head -n 1)

          if [ -z "$PATCH_URL" ] || [ "$PATCH_URL" == "null" ]; then
            PATCH_URL=$(echo "$RELEASE_INFO" | jq -r '.[0].description' | grep -oP 'https://gitlab.com/[^\s)]+\.(mpp|rvp|jar)' | head -n 1)
          fi

          if [ -z "$PATCH_URL" ] || [ "$PATCH_URL" == "null" ]; then
            echo "::error:: Could not find patch file URL in GitLab releases!"
            exit 1
          fi

          echo "Downloading patch from: $PATCH_URL"
          curl -L -o paresh-patches.mpp "$PATCH_URL"
          
          echo "Patch file details:"
          ls -lh paresh-patches.mpp
          file paresh-patches.mpp

      - name: Download & Auto-Merge APKM/Bundle
        run: |
          echo "Downloading file..."
          DRIVE_ID=$(echo "${{ github.event.inputs.apk_url }}" | grep -oP '(?<=/d/|id=)[a-zA-Z0-9_-]+' | head -n 1)
          
          if [ -n "$DRIVE_ID" ]; then
            echo "Google Drive link detected. Using gdown for ID: $DRIVE_ID"
            gdown --id "$DRIVE_ID" -O downloaded_file || curl -L -o downloaded_file "https://drive.google.com/uc?export=download&id=${DRIVE_ID}"
          else
            curl -L -A "Mozilla/5.0" -o downloaded_file "${{ github.event.inputs.apk_url }}"
          fi

          FILE_TYPE=$(file downloaded_file)
          FILE_SIZE=$(stat -c%s downloaded_file)
          echo "Downloaded file type: $FILE_TYPE"
          echo "Downloaded file size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 10000000 ]; then
            echo "::error:: Downloaded file is too small ($FILE_SIZE bytes). Check file URL!"
            exit 1
          fi

          if [[ "$FILE_TYPE" == *"Zip archive"* ]] || [[ "${{ github.event.inputs.apk_url }}" =~ \.(apkm|xapk|apks|zip) ]]; then
            echo "Bundle file detected! Merging into standalone APK..."
            java -jar APKEditor.jar m -i downloaded_file -o jiohotstar.apk
          else
            echo "Single APK file detected."
            mv downloaded_file jiohotstar.apk
          fi

      - name: Patch APK
        run: |
          echo "Patching APK using Morphe CLI..."

          # Clean official Morphe CLI command
          java -jar morphe-cli.jar patch -p paresh-patches.mpp jiohotstar.apk 2>&1 | tee patch.log

          # Locate generated output APK file
          OUT_APK=$(ls *patched*.apk jiohotstar-patched.apk 2>/dev/null | head -n 1)
          if [ -n "$OUT_APK" ]; then
            echo "Patching successful! Generated file: $OUT_APK"
            mv "$OUT_APK" jiohotstar-patched.apk
          else
            echo "=================== FULL ERROR LOG ==================="
            cat patch.log
            echo "======================================================"
            exit 1
          fi

      - name: Download APK Signer & Sign APK
        run: |
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar uber-apk-signer-1.3.0.jar -a jiohotstar-patched.apk --overwrite

      - name: Upload Patched APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JioHotstar-Patched-APK
          path: jiohotstar-patched.apk
